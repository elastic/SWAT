[tool.poetry]
name = "swat"
version = "0.0.1"
description = "Simple Workspace Attack Tool for emulating against Google Workspace environments."
authors = ["Terrance DeJesus <contact@dejesus.io>"]
license = "Apache-2.0"
readme = "README.rst"
homepage = "https://github.com/elastic/SWAT"
repository = "https://github.com/elastic/SWAT"
documentation = "https://github.com/elastic/SWAT/wiki"
keywords = ["swat", "red-teaming", "Google Workspace", "security"]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Topic :: Security",
    "Topic :: Google Workspace",
]

[tool.poetry.dependencies]
python = "^3.10"
colorama = "0.4.6"
google-auth = "2.56.3"
google-auth-oauthlib = "1.4.0"
google-auth-httplib2 = "0.4.1"
google-api-python-client = "2.198.0"
PyYAML = "6.0.3"
requests = "2.34.2"
semver = "3.0.4"
tabulate = "0.10.0"
pandas = { version = "2.3.3", optional = true }
selenium = "4.47.0"
sphinx = "8.1.3"
sphinx-rtd-theme = "3.1.0"
pytest = "8.4.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
audit_support = ["pandas"]

[tool.poetry.scripts]
swat = 'swat.main:main'
